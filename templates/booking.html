<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking - Jarir Hotel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="hotel-page">

    <!-- Header -->
    <header class="header">

        <a href="{{ url_for('home') }}" class="logo">
            <div class="logo-box">
                <div class="logo-j">J</div>
                <div class="logo-text-small">JARIR HOTEL</div>
            </div>
        </a>

        <div class="hotel-name">
            Jarir Hotel
        </div>

        <nav class="navigation">
            <a href="{{ url_for('register') }}">Join</a>
            <span>|</span>
            <a href="{{ url_for('login') }}">Sign in</a>
        </nav>

    </header>


    <!-- Booking -->
    <main class="booking-container">

        <div class="booking-box">

            <h1>Complete your booking</h1>

            <p class="booking-intro">
                Please check your booking information before confirming.
            </p>


            <form action="{{ url_for('booking_confirmation') }}" method="GET">
              <input type="hidden" name="room_id" value="{{ room_id }}">
              <input type="hidden" name="room_id" value="{{ room_id }}">
                <!-- Dates -->
                <div class="booking-row">

                    <div class="booking-group">
                        <label for="checkin">Check in</label>

                        <input
                            type="date"
                            id="checkin"
                            name="checkin"
                            required
                        >
                    </div>


                    <div class="booking-group">
                        <label for="checkout">Check out</label>

                        <input
                            type="date"
                            id="checkout"
                            name="checkout"
                            required
                        >
                    </div>

                </div>


                <!-- Guests -->
                <div class="booking-group">

                    <label for="guests">
                        Number of guests
                    </label>

                    <select id="guests" name="guests" required>

                        <option value="">
                            Select guests
                        </option>

                        <option value="1">
                            1 guest
                        </option>

                        <option value="2">
                            2 guests
                        </option>

                        <option value="3">
                            3 guests
                        </option>

                        <option value="4">
                            4 guests
                        </option>

                        <option value="5">
                            5 guests
                        </option>

                        <option value="6">
                            6 guests
                        </option>

                    </select>

                </div>


                <!-- Rooms -->
                <div class="booking-group">

                    <label for="rooms">
                        Number of rooms
                    </label>

                    <select id="rooms" name="rooms" required>

                        <option value="">
                            Select rooms
                        </option>

                        <option value="1">
                            1 room
                        </option>

                        <option value="2">
                            2 rooms
                        </option>

                        <option value="3">
                            3 rooms
                        </option>

                    </select>

                </div>


                <!-- Confirm -->
                <button
                    type="submit"
                    class="booking-button">
                    Confirm Booking
                </button>

            </form>

        </div>

    </main>
 

    <!-- Footer -->
    <footer class="footer">
        {% include 'footer.html' %}
    </footer>

</div>

</body>
</html>
