<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jarir Hotel</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="hotel-page">

        <!-- Header -->
        <header class="header">

            <a href="/" class="logo">
                <div class="logo-box">
                    <span class="logo-j">J</span>
                    <span class="logo-text-small">JARIR</span>
                    <span class="logo-text-small">HOTEL</span>
                </div>
            </a>

            <div class="hotel-name">
                Jarir Hotel
            </div>

            <div class="navigation">
              <a href="{{ url_for('register') }}">Join</a>
              <span>|</span>
              <a href="{{ url_for('login') }}">Sign in</a>
          </div>

        </header>


        <!-- Main content -->
        <main class="main-content">

            <h1>Select a date</h1>

            <!-- Dates -->
            <div class="date-container">

                <div class="input-box">
                    <label for="checkin">Check in</label>

                    <input
                        type="date"
                        id="checkin"
                        name="checkin"
                    >
                </div>

                <div class="input-box">
                    <label for="checkout">Check out</label>

                    <input
                        type="date"
                        id="checkout"
                        name="checkout"
                    >
                </div>

            </div>


            <!-- Occupancy -->
            <div class="select-box">

                <label for="occupancy">
                    Select occupancy
                </label>

                <select id="occupancy" name="occupancy">
                    <option value="">Select occupancy</option>
                    <option value="1">1 guest</option>
                    <option value="2">2 guests</option>
                    <option value="3">3 guests</option>
                    <option value="4">4 guests</option>
                    <option value="5">5 guests</option>
                    <option value="6">6 guests</option>
                </select>

            </div>


            <!-- Rooms -->
            <div class="select-box">

                <label for="rooms">
                    Rooms
                </label>

                <select id="rooms" name="rooms">
                    <option value="">Select rooms</option>
                    <option value="1">1 room</option>
                    <option value="2">2 rooms</option>
                    <option value="3">3 rooms</option>
                    <option value="4">4 rooms</option>
                    <option value="5">5 rooms</option>
                </select>

            </div>


            <!-- Search button -->
            <button
                type="button"
                class="search-button"
                onclick="searchRooms()"
            >
                Search
            </button>

        </main>


        <!-- Footer -->
        <footer class="footer">

            <button class="language-button" onclick="changeLanguage()">
                EN
            </button>

        </footer>

    </div>


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
