<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join - Jarir Hotel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="hotel-page">

    <!-- Header -->
    <header class="header">

        <a href="{{ url_for('home') }}" class="logo">
            <div class="logo-box">
                <div class="logo-j">J</div>
                <div class="logo-text-small">JARIR HOTEL</div>
            </div>
        </a>

        <div class="hotel-name">
            Jarir Hotel
        </div>

        <nav class="navigation">
            <a href="{{ url_for('register') }}">Join</a>
            <span>|</span>
            <a href="{{ url_for('login') }}">Sign in</a>
        </nav>

    </header>


    <!-- Register -->
    <main class="auth-container">

        <h1>Join</h1>

        <form class="auth-form" method="POST" action="{{ url_for('register') }}">

            <!-- Full name -->
            <div class="form-group">

                <label for="name">
                    Full name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Address -->
            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                    required
                >

            </div>


            <!-- Postcode + City -->
            <div class="form-row">

                <div class="form-group">

                    <label for="postcode">
                        Postcode
                    </label>

                    <input
                        type="text"
                        id="postcode"
                        name="postcode"
                        placeholder="e.g. 8011AB"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city"
                        required
                    >

                </div>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Confirm password -->
            <div class="form-group">

                <label for="confirm-password">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <!-- Join button -->
            <button
                type="submit"
                class="auth-button">
                Join
            </button>

        </form>


        <!-- Login link -->
        <p class="auth-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Sign in
            </a>

        </p>

    </main>


    <!-- Footer -->
    <footer class="footer">

        {% include 'footer.html' %}

    </footer>

</div>

</body>
</html>
