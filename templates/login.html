<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in - Jarir Hotel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="hotel-page">

    <!-- Header -->
    <header class="header">

        <a href="/" class="logo">
            <div class="logo-box">
                <span class="logo-j">J</span>
                <span class="logo-text-small">JARIR</span>
                <span class="logo-text-small">HOTEL</span>
            </div>
        </a>

        <div class="hotel-name">
            Jarir Hotel
        </div>

        <nav class="navigation">
            <a href="{{ url_for('register') }}">Join</a>
            <span>|</span>
            <a href="{{ url_for('login') }}">Sign in</a>
        </nav>

    </header>


    <!-- Sign in -->
    <main class="auth-container">

        <h1>Sign in</h1>

        <form
        action="{{ url_for('login', room_id=room_id) }}"
        method="POST"
        class="auth-form"
    >
    
        <input
            type="hidden"
            name="room_id"
            value="{{ room_id }}"
        >
    
        <!-- email -->
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    
        <!-- password -->
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    
        <button type="submit" class="auth-button">
            Sign in
        </button>
    
    </form>


        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Join</a>
        </p>

    </main>


    <!-- Footer -->
    <footer class="footer">

        {% include 'footer.html' %}

    </footer>

</div>

</body>
</html>
